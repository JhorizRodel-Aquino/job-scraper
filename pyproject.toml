[project]
name = "job-scraper"
version = "0.1.0"
description = "Scheduled crawler that collects software engineering job postings from API/feed sources into a local SQLite database."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]
browser = [
    "playwright>=1.40",
]
ui = [
    "streamlit>=1.38",
]

[project.scripts]
job-scraper = "job_scraper.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
